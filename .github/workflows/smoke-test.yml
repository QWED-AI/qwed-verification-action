name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-secrets:
    name: scan-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run QWED secret scan
        id: scan
        uses: ./
        with:
          action: scan-secrets
          paths: "action.yml,.github/**"
          fail_on_findings: "false"
      - name: Verify outputs
        env:
          VERIFIED: ${{ steps.scan.outputs.verified }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          ADMISSION: ${{ steps.scan.outputs.admission }}
        run: |
          test -n "$VERIFIED" && echo "verified output ok"
          if [ -n "$VERDICT" ]; then
            echo "verdict: $VERDICT"
            case "$VERDICT" in
              VERIFIED|UNVERIFIABLE|BLOCKED) ;;
              *) echo "Invalid verdict: $VERDICT" >&2; exit 1 ;;
            esac
          else
            echo "verdict not yet emitted by image (backward-compatible)"
          fi
          if [ -n "$ADMISSION" ]; then
            echo "admission: $ADMISSION"
            case "$ADMISSION" in
              ADMIT|DENY) ;;
              *) echo "Invalid admission: $ADMISSION" >&2; exit 1 ;;
            esac
            if [ -n "$VERDICT" ]; then
              if [ "$VERDICT" = "UNVERIFIABLE" ] || [ "$VERDICT" = "BLOCKED" ]; then
                [ "$ADMISSION" = "DENY" ] || { echo "Fail-closed violation: $VERDICT must produce DENY" >&2; exit 1; }
              fi
            fi
          else
            echo "admission not yet emitted by image (backward-compatible)"
          fi

  test-code:
    name: scan-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run QWED code scan
        id: scan
        uses: ./
        with:
          action: scan-code
          paths: "**/*.yml"
          fail_on_findings: "false"
      - name: Verify outputs
        env:
          VERIFIED: ${{ steps.scan.outputs.verified }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          ADMISSION: ${{ steps.scan.outputs.admission }}
        run: |
          test -n "$VERIFIED" && echo "verified output ok"
          if [ -n "$VERDICT" ]; then echo "verdict: $VERDICT"; fi
          if [ -n "$ADMISSION" ]; then echo "admission: $ADMISSION"; fi

  test-shell:
    name: verify-shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run QWED shell verify
        id: scan
        uses: ./
        with:
          action: verify-shell
          paths: "**/*.sh"
          fail_on_findings: "false"
      - name: Verify outputs
        env:
          VERIFIED: ${{ steps.scan.outputs.verified }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          ADMISSION: ${{ steps.scan.outputs.admission }}
        run: |
          test -n "$VERIFIED" && echo "verified output ok"
          if [ -n "$VERDICT" ]; then echo "verdict: $VERDICT"; fi
          if [ -n "$ADMISSION" ]; then echo "admission: $ADMISSION"; fi

  test-verification-context:
    name: verification-context output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run with VC output format
        id: scan
        uses: ./
        with:
          action: scan-secrets
          paths: "action.yml"
          output_format: verification-context
          fail_on_findings: "false"
      - name: Verify VC document
        env:
          VERIFICATION_CONTEXT: ${{ steps.scan.outputs.verification_context }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          ADMISSION: ${{ steps.scan.outputs.admission }}
          VERIFIED: ${{ steps.scan.outputs.verified }}
        run: |
          test -n "$VERIFIED" && echo "verified output ok"
          if [ -n "$VERIFICATION_CONTEXT" ]; then
            echo "VC document emitted"
            printf '%s' "$VERIFICATION_CONTEXT" | jq -e . >/dev/null
            printf '%s' "$VERIFICATION_CONTEXT" | jq -e '.spec_version == "1.0"' >/dev/null
            printf '%s' "$VERIFICATION_CONTEXT" | jq -e '.verdict' >/dev/null
            printf '%s' "$VERIFICATION_CONTEXT" | jq -e '.context.decision.admission' >/dev/null
            echo "VC document validated against v1.0 contract"
          else
            echo "VC document not yet emitted by image (backward-compatible — image needs VC v1.0 output support)"
          fi
          if [ -n "$VERDICT" ]; then echo "verdict: $VERDICT"; fi
          if [ -n "$ADMISSION" ]; then echo "admission: $ADMISSION"; fi
