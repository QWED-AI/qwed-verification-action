name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-action:
    name: action.yml contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate action metadata
        run: |
          python - <<'EOF'
          import re
          import sys
          import yaml

          failures = []

          def check(cond, message):
              # Explicit checks (not assert): the QWED assert-validation
              # rule flags bare assert as a sole validation boundary, and
              # explicit failures carry clearer CI messages anyway.
              if not cond:
                  failures.append(message)

          with open("action.yml", encoding="utf-8") as f:
              action = yaml.safe_load(f)
          check(isinstance(action, dict), "action.yml must parse to a mapping")

          for key in ("name", "description", "author", "branding", "inputs", "outputs", "runs"):
              check(key in action, f"action.yml missing required key: {key}")

          inputs = action.get("inputs", {})
          check(isinstance(inputs, dict), "action.yml inputs must be a mapping")
          if isinstance(inputs, dict):
              for name in (
                  "action", "engine", "query", "llm_output", "paths",
                  "output_format", "fail_on_findings", "api_key", "api_url",
                  "provider", "model", "mask_pii", "milestones",
              ):
                  check(name in inputs, f"action.yml missing input: {name}")

          outputs = action.get("outputs", {})
          check(isinstance(outputs, dict), "action.yml outputs must be a mapping")
          if isinstance(outputs, dict):
              for name in (
                  "verified", "verdict", "admission", "proof_ref",
                  "verification_context", "explanation", "findings_count",
                  "badge_url", "sarif_file",
              ):
                  check(name in outputs, f"action.yml missing output: {name}")

          runs = action.get("runs", {})
          check(runs.get("using") == "docker", "action must run on docker")
          image = runs.get("image", "")
          check(
              bool(re.fullmatch(r"docker://[^@]+@sha256:[0-9a-f]{64}", image or "")),
              f"image must use an immutable digest, got: {image!r}",
          )

          if failures:
              print("action.yml contract FAILED:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)
          print("action.yml contract OK")
          EOF

  test-secrets:
    name: scan-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run QWED secret scan
        id: scan
        uses: ./
        with:
          action: scan-secrets
          paths: "action.yml,.github/**"
          fail_on_findings: "false"
      - name: Verify outputs
        env:
          VERIFIED: ${{ steps.scan.outputs.verified }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          ADMISSION: ${{ steps.scan.outputs.admission }}
          EXPLANATION: ${{ steps.scan.outputs.explanation }}
          FINDINGS_COUNT: ${{ steps.scan.outputs.findings_count }}
        run: |
          case "$VERIFIED" in
            true|false) echo "verified: $VERIFIED" ;;
            *) echo "Invalid or missing verified output: '$VERIFIED'" >&2; exit 1 ;;
          esac
          # Explanation is guaranteed non-empty only on success paths: the
          # engine emits no explanation for UNVERIFIABLE/BLOCKED outcomes,
          # so requiring it unconditionally fails legitimate runs.
          if [ "$VERIFIED" = "true" ] && [ -z "$EXPLANATION" ]; then
            echo "FAIL: explanation output empty on verified=true" >&2; exit 1
          fi
          case "$FINDINGS_COUNT" in
            ''|*[!0-9]*) echo "FAIL: findings_count not a number: '$FINDINGS_COUNT'" >&2; exit 1 ;;
            *) echo "findings_count: $FINDINGS_COUNT" ;;
          esac
          if [ -n "$VERDICT" ]; then
            echo "verdict: $VERDICT"
            case "$VERDICT" in
              VERIFIED|UNVERIFIABLE|BLOCKED) ;;
              *) echo "Invalid verdict: $VERDICT" >&2; exit 1 ;;
            esac
          elif [ "$VERIFIED" = "true" ]; then
            echo "FAIL: verified=true with empty verdict" >&2; exit 1
          fi
          if [ -n "$VERDICT" ]; then
            echo "verdict: $VERDICT"
            case "$VERDICT" in
              VERIFIED|UNVERIFIABLE|BLOCKED) ;;
              *) echo "Invalid verdict: $VERDICT" >&2; exit 1 ;;
            esac
          fi
          if [ -n "$ADMISSION" ]; then
            echo "admission: $ADMISSION"
            case "$ADMISSION" in
              ADMIT|DENY) ;;
              *) echo "Invalid admission: $ADMISSION" >&2; exit 1 ;;
            esac
            if [ -n "$VERDICT" ]; then
              if [ "$VERDICT" = "UNVERIFIABLE" ] || [ "$VERDICT" = "BLOCKED" ]; then
                [ "$ADMISSION" = "DENY" ] || { echo "Fail-closed violation: $VERDICT must produce DENY" >&2; exit 1; }
              fi
              if [ "$VERDICT" = "VERIFIED" ] && [ "$ADMISSION" = "ADMIT" ]; then
                [ "$VERIFIED" = "true" ] || { echo "Consistency violation: VERIFIED+ADMIT must have verified=true" >&2; exit 1; }
              fi
              if [ "$VERIFIED" = "true" ]; then
                [ "$VERDICT" = "VERIFIED" ] || { echo "Consistency violation: verified=true requires verdict=VERIFIED" >&2; exit 1; }
                [ "$ADMISSION" = "ADMIT" ] || { echo "Consistency violation: verified=true requires admission=ADMIT" >&2; exit 1; }
              fi
            fi
          fi

  test-code:
    name: scan-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run QWED code scan
        id: scan
        uses: ./
        with:
          action: scan-code
          paths: "**/*.yml"
          fail_on_findings: "false"
      - name: Verify outputs
        env:
          VERIFIED: ${{ steps.scan.outputs.verified }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          ADMISSION: ${{ steps.scan.outputs.admission }}
        run: |
          case "$VERIFIED" in
            true|false) echo "verified: $VERIFIED" ;;
            *) echo "Invalid or missing verified output: '$VERIFIED'" >&2; exit 1 ;;
          esac
          if [ -n "$VERDICT" ]; then echo "verdict: $VERDICT"; fi
          if [ -n "$ADMISSION" ]; then echo "admission: $ADMISSION"; fi

  test-shell:
    name: verify-shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run QWED shell verify
        id: scan
        uses: ./
        with:
          action: verify-shell
          paths: "**/*.sh"
          fail_on_findings: "false"
      - name: Verify outputs
        env:
          VERIFIED: ${{ steps.scan.outputs.verified }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          ADMISSION: ${{ steps.scan.outputs.admission }}
        run: |
          case "$VERIFIED" in
            true|false) echo "verified: $VERIFIED" ;;
            *) echo "Invalid or missing verified output: '$VERIFIED'" >&2; exit 1 ;;
          esac
          if [ -n "$VERDICT" ]; then echo "verdict: $VERDICT"; fi
          if [ -n "$ADMISSION" ]; then echo "admission: $ADMISSION"; fi

  test-verification-context:
    name: verification-context output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run with VC output format
        id: scan
        uses: ./
        with:
          action: scan-secrets
          paths: "action.yml"
          output_format: verification-context
          fail_on_findings: "false"
      - name: Verify VC document
        env:
          VERIFICATION_CONTEXT: ${{ steps.scan.outputs.verification_context }}
          VERDICT: ${{ steps.scan.outputs.verdict }}
          ADMISSION: ${{ steps.scan.outputs.admission }}
          VERIFIED: ${{ steps.scan.outputs.verified }}
          PROOF_REF: ${{ steps.scan.outputs.proof_ref }}
        run: |
          case "$VERIFIED" in
            true|false) echo "verified: $VERIFIED" ;;
            *) echo "Invalid or missing verified output: '$VERIFIED'" >&2; exit 1 ;;
          esac
          if [ -z "$VERIFICATION_CONTEXT" ]; then
            echo "FAIL: verification_context is empty but output_format=verification-context was requested" >&2
            echo "The Docker image does not yet support VC v1.0 outputs (tracked in #9)" >&2
            exit 1
          fi
          echo "VC document emitted — validating full contract"
          printf '%s' "$VERIFICATION_CONTEXT" | jq -e . >/dev/null
          printf '%s' "$VERIFICATION_CONTEXT" | jq -e '.spec_version == "1.0"' >/dev/null
          VC_VERDICT=$(printf '%s' "$VERIFICATION_CONTEXT" | jq -r '.verdict')
          VC_ADMISSION=$(printf '%s' "$VERIFICATION_CONTEXT" | jq -r '.context.decision.admission')
          VC_PROOF_REF=$(printf '%s' "$VERIFICATION_CONTEXT" | jq -r '.context.evidence.proof_ref // empty')
          echo "VC verdict: $VC_VERDICT"
          echo "VC admission: $VC_ADMISSION"
          case "$VC_VERDICT" in
            VERIFIED|UNVERIFIABLE|BLOCKED) ;;
            *) echo "Invalid VC verdict: $VC_VERDICT" >&2; exit 1 ;;
          esac
          case "$VC_ADMISSION" in
            ADMIT|DENY) ;;
            *) echo "Invalid VC admission: $VC_ADMISSION" >&2; exit 1 ;;
          esac
          if [ "$VC_VERDICT" = "UNVERIFIABLE" ] || [ "$VC_VERDICT" = "BLOCKED" ]; then
            [ "$VC_ADMISSION" = "DENY" ] || { echo "Fail-closed violation: $VC_VERDICT must have admission=DENY" >&2; exit 1; }
          fi
          if [ "$VC_VERDICT" = "VERIFIED" ]; then
            [ -n "$VC_PROOF_REF" ] || { echo "VERIFIED must have proof_ref" >&2; exit 1; }
            if [[ ! "$VC_PROOF_REF" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Invalid proof_ref format: $VC_PROOF_REF" >&2; exit 1
            fi
          else
            [ -z "$VC_PROOF_REF" ] || { echo "$VC_VERDICT must have an empty proof_ref" >&2; exit 1; }
          fi
          EXPECTED_VERIFIED="false"
          if [ "$VC_VERDICT" = "VERIFIED" ] && [ "$VC_ADMISSION" = "ADMIT" ]; then
            EXPECTED_VERIFIED="true"
          fi
          [ "$VERIFIED" = "$EXPECTED_VERIFIED" ] || { echo "Consistency violation: verified=$VERIFIED but expected $EXPECTED_VERIFIED for verdict=$VC_VERDICT admission=$VC_ADMISSION" >&2; exit 1; }
          [ -n "$VERDICT" ] || { echo "Missing scalar verdict when VC is present" >&2; exit 1; }
          [ -n "$ADMISSION" ] || { echo "Missing scalar admission when VC is present" >&2; exit 1; }
          [ "$VERDICT" = "$VC_VERDICT" ] || { echo "Scalar verdict ($VERDICT) != VC verdict ($VC_VERDICT)" >&2; exit 1; }
          [ "$ADMISSION" = "$VC_ADMISSION" ] || { echo "Scalar admission ($ADMISSION) != VC admission ($VC_ADMISSION)" >&2; exit 1; }
          [ "$PROOF_REF" = "$VC_PROOF_REF" ] || { echo "Scalar proof_ref ($PROOF_REF) != VC proof_ref ($VC_PROOF_REF)" >&2; exit 1; }
          echo "VC v1.0 contract validated — all checks passed"

  test-verify-process:
    name: verify-process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run QWED verify-process
        id: verify
        uses: ./
        with:
          action: verify-process
          query: "Derivative of x^2"
          llm_output: "The derivative of x^2 is 2x."
          milestones: "answer,reasoning"
          fail_on_findings: "false"
      - name: Verify outputs shape contract
        env:
          VERIFIED: ${{ steps.verify.outputs.verified }}
          VERDICT: ${{ steps.verify.outputs.verdict }}
          ADMISSION: ${{ steps.verify.outputs.admission }}
          EXPLANATION: ${{ steps.verify.outputs.explanation }}
        run: |
          case "$VERIFIED" in
            true|false) echo "verified: $VERIFIED" ;;
            *) echo "Invalid or missing verified output: '$VERIFIED'" >&2; exit 1 ;;
          esac
          # VERDICT/ADMISSION are mandatory outputs: an empty value is a
          # missing-output regression, not a verdict.
          [ -n "$VERDICT" ] || { echo "FAIL: verdict output empty" >&2; exit 1; }
          case "$VERDICT" in
            VERIFIED|UNVERIFIABLE|BLOCKED) echo "verdict: $VERDICT" ;;
            *) echo "Invalid verdict: $VERDICT" >&2; exit 1 ;;
          esac
          [ -n "$ADMISSION" ] || { echo "FAIL: admission output empty" >&2; exit 1; }
          case "$ADMISSION" in
            ADMIT|DENY) echo "admission: $ADMISSION" ;;
            *) echo "Invalid admission: $ADMISSION" >&2; exit 1 ;;
          esac
          if [ "$VERIFIED" = "true" ] && [ -z "$EXPLANATION" ]; then
            echo "FAIL: explanation output empty on verified=true" >&2; exit 1
          fi

  test-sarif:
    name: sarif output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run QWED scan with SARIF output
        id: scan
        uses: ./
        with:
          action: scan-secrets
          paths: "action.yml"
          output_format: sarif
          fail_on_findings: "false"
      - name: Verify SARIF document
        env:
          SARIF_FILE: ${{ steps.scan.outputs.sarif_file }}
        run: |
          [ -n "$SARIF_FILE" ] || { echo "FAIL: sarif_file output empty" >&2; exit 1; }
          if [ -f "$SARIF_FILE" ]; then
            SARIF_DOC=$(cat "$SARIF_FILE")
          else
            SARIF_DOC="$SARIF_FILE"
          fi
          printf '%s' "$SARIF_DOC" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('version','').startswith('2.1'), 'bad sarif version'; assert isinstance(d.get('runs'), list), 'sarif runs not a list'; print('SARIF well-formed')"
